name: Deploy FastAPI App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fastapi-practice:latest
            ${{ vars.DOCKERHUB_USERNAME }}/fastapi-practice:${{ github.sha }}

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            sudo docker pull ${{ vars.DOCKERHUB_USERNAME }}/fastapi-practice:${{ github.sha }}

            sudo docker stop fastapi-app || true
            sudo docker rm fastapi-app || true

            sudo docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              ${{ vars.DOCKERHUB_USERNAME }}/fastapi-practice:${{ github.sha }}

            sleep 5
            sudo docker inspect --format='{{.State.Running}}' fastapi-app | grep -qx true
            echo "Deployment successful"